<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="More YouTube thumbnail showcase by Sujan Timalsina." />
  <title>More Thumbnail Showcase | Sujan Timalsina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    :root {
      --card-bg: rgba(7, 13, 27, 0.82);
      --thumb-shadow: rgba(0, 0, 0, 0.35);
    }

    body {
      background: var(--bg2);
      color: var(--tx);
    }

    .showcase-nav {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px clamp(16px, 5vw, 56px);
      background: #050b13;
      border-bottom: 1px solid var(--ln);
    }

    .showcase-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .showcase-brand img {
      height: clamp(28px, 4vw, 38px);
      width: auto;
    }

    .showcase-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      border: 1px solid var(--bdr);
      background: var(--sub);
      color: var(--ac3);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .showcase-tag .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ac2);
      box-shadow: 0 0 16px rgba(96, 165, 250, 0.9);
    }

    .showcase-back {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--ln2);
      color: var(--tx2);
      font-size: 0.84rem;
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .showcase-back:hover {
      border-color: var(--bdr);
      background: var(--sub);
      color: var(--tx);
    }

    .showcase-mobile-menu {
      display: none;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--ln2);
      background: rgba(59, 130, 246, 0.06);
      color: var(--tx);
    }

    .showcase-page {
      padding: clamp(48px, 7vw, 86px) 0 clamp(80px, 9vw, 120px);
      background: #070d1b;
      position: relative;
      overflow: hidden;
    }

    .showcase-header {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto clamp(28px, 5vw, 46px);
      text-align: center;
    }

    .showcase-header h1 {
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
      margin-bottom: 10px;
    }

    .showcase-header p {
      color: var(--tx2);
      font-size: clamp(0.9rem, 2vw, 1.04rem);
      line-height: 1.8;
      max-width: 620px;
      margin: 0 auto;
    }

    .showcase-grid {
      position: relative;
      z-index: 1;
      width: min(1220px, calc(100% - 32px));
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: clamp(18px, 3vw, 28px);
    }

    .video-card {
      background: var(--card-bg);
      border: 1px solid var(--ln2);
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 20px 34px rgba(0, 0, 0, 0.16);
    }

    .video-card:hover {
      transform: translateY(-6px);
      border-color: var(--bdr);
      box-shadow: 0 28px 44px rgba(0, 0, 0, 0.22), 0 0 0 1px rgba(59, 130, 246, 0.16);
    }

    .video-thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #0a1428;
    }

    .video-thumb {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .video-card:hover .video-thumb {
      transform: scale(1.035);
    }

    .video-card-body {
      display: flex;
      gap: 12px;
      padding: 14px 14px 16px;
    }

    .channel-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--bdr);
      background: rgba(59, 130, 246, 0.12);
    }

    .channel-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .video-info {
      flex: 1;
      min-width: 0;
    }

    .video-title {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: -0.02em;
      color: var(--tx);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 7px;
    }

    .channel-name {
      color: var(--tx2);
      font-size: 0.82rem;
      font-weight: 500;
      line-height: 1.4;
    }

    .video-stats {
      margin-top: 4px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      color: var(--tx2);
      font-size: 0.76rem;
      line-height: 1.4;
    }

    .video-stats .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--tx2);
      display: inline-block;
      opacity: 0.8;
    }

    @media (max-width: 820px) {
      .showcase-nav {
        gap: 10px;
      }

      .showcase-tag {
        display: none;
      }

      .showcase-back {
        display: none;
      }

      .showcase-mobile-menu {
        display: inline-flex;
      }
    }

    @media (max-width: 560px) {
      .showcase-grid {
        width: min(100% - 20px, 420px);
      }

      .video-card-body {
        gap: 10px;
      }

      .video-title {
        font-size: 0.96rem;
      }
    }
  </style>
</head>
<body>
  <nav class="showcase-nav" aria-label="top navigation">
    <a href="index.html" class="showcase-brand" aria-label="Go back to homepage">
      <img src="images/logo/logo.png" alt="Sujan Timalsina" />
    </a>

    <div class="showcase-tag"><span class="dot"></span>Thumbnail Showcase</div>

    <a href="index.html" class="showcase-back" aria-label="Back to homepage">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6" /></svg>
      Back to Portfolio
    </a>

    <a href="index.html" class="showcase-mobile-menu" aria-label="Open homepage menu">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </a>
  </nav>

  <main class="showcase-page">
    <header class="showcase-header">
      <div class="ey rv d1">Featured Work</div>
      <h1 class="rv d2">Thumbnail Showcase</h1>
      <p class="rv d3">High-converting designs shaped for click-through performance, channel branding, and creator growth.</p>
    </header>

    <section class="showcase-grid" id="videoGrid" aria-label="Thumbnail showcase gallery"></section>
  </main>

  <script>
    const videos = [
      { title: 'Laka Gaming is Live - Freefire', channel: 'Laka Gaming', views: '3.7k watching', date: 'Live now', thumb: 'images/thumbnails/work1.webp', avatar: 'images/clients/client2.jpg' },
      { title: 'Cheap Mo:Mo Vs Expensive Mo:Mo in Nepal', channel: 'Challangecraft', views: 'N/A', date: 'not published', thumb: 'images/thumbnails/work2.webp', avatar: 'images/clients/client21.webp' },
      { title: 'Openly ready for Collection Battle 🤫 Buying Everything in Free Fire - Tonde Gamer', channel: 'Tonde Gamer', views: '937k views', date: '1 years ago', thumb: 'images/thumbnails/thumbnail11.jpg', avatar: 'images/clients/client1.jpg' },
      { title: 'Nepali prank || Bachha chor prank 😂😂', channel: 'chunu vlogs', views: '602k views', date: '2 years ago', thumb: 'images/thumbnails/thumbnail8.jpg', avatar: 'images/clients/client4.jpg' },
      { title: '‪@blackflagarmy9340‬ 🇮🇳 Vs Abhishek Yt 🇳🇵Biggest Collection Verses Ever 🧐💵', channel: 'ABHISHEK YT', views: '161K views', date: '5 months ago', thumb: 'images/thumbnails/thumbnail16.jpg', avatar: 'images/clients/client3.jpg' },
      { title: 'Reaction on Nepali in Holi by ‪@101_vines‬', channel: 'Sweta Basnet', views: 'redesigned only', date: '1 years ago', thumb: 'images/thumbnails/thumbnail7.jpg', avatar: 'images/clients/client22.jpg' },
      { title: 'After Dynamic Duo Break💔 Here is the Gift🎁', channel: 'Laka Gaming', views: '209K views', date: '19 hours ago', thumb: 'images/thumbnails/work3.webp', avatar: 'images/clients/client2.jpg' },
      { title: 'Hard To Rise VC Money? Watch This!', channel: 'Lobster Capital', views: 'N/A', date: '8 months ago', thumb: 'images/thumbnails/thumbnail4.jpg', avatar: 'images/clients/client19.jpg' },
      { title: 'Durbar Hatyakanda - Nepals BIGGEST LIE?', channel: 'IN-Depth Story', views: 'N/A', date: '1 Years ago', thumb: 'images/thumbnails/thumbnail1.jpg', avatar: 'images/clients/client23.jpg' },
      { title: 'YUNG GORKHAY - HIP TO THE HOP || Prod.by ‪@Dr.Senza808‬ || NEPALI HIPHOP ||', channel: 'YUNG GORKHAY', views: 'N/A', date: '6 months ago', thumb: 'images/thumbnails/thumbnail2.jpg', avatar: 'images/clients/client24.jpg' },
      { title: '🔴[Live] Day 1🔥Br New 53 Rank Season Road to Top-1With‪@LakaGamingz‬ 🥵#freefirelive#shortsfeed', channel: 'ABHISHEK YT', views: '3.9k watching', date: '1 month ago', thumb: 'images/thumbnails/thumbnail12.jpg', avatar: 'images/clients/client3.jpg' },
      { title: 'Portfolio Update Sooon | Thanks For Visiting', channel: 'Sujan Timalsina', views: 'N/A', date: 'N/A', thumb: 'images/thumbnails/updatesoon.jpg', avatar: 'images/logo/favicon.ico' },

    ];

    const grid = document.getElementById('videoGrid');

    videos.forEach((video, index) => {
      const card = document.createElement('article');
      card.className = 'video-card rv';
      card.style.transitionDelay = `${index * 70}ms`;
      card.innerHTML = `
        <div class="video-thumb-wrap">
          <img class="video-thumb" src="${video.thumb}" alt="${video.title}" loading="lazy" />
        </div>
        <div class="video-card-body">
          <div class="channel-avatar">
            <img src="${video.avatar}" alt="${video.channel}" loading="lazy" />
          </div>
          <div class="video-info">
            <div class="video-title">${video.title}</div>
            <div class="channel-name">${video.channel}</div>
            <div class="video-stats">
              <span>${video.views}</span>
              <span class="dot" aria-hidden="true"></span>
              <span>${video.date}</span>
            </div>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.rv').forEach((el) => observer.observe(el));
  </script>
</body>
</html>
